<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — WaveTickets</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .dash-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      margin-bottom: 28px;
    }
    .dash-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dash-welcome { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 2px; }
    .dash-name { font-size: 1.2rem; font-weight: 800; }

    .logout-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .logout-btn:hover { border-color: var(--danger); color: var(--danger); }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 16px;
    }
    .stat-card-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .stat-card-val {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
    }

    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .event-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 8px;
    }
    .event-title { font-weight: 700; font-size: 0.95rem; }
    .event-date { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; }
    .event-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 14px;
    }
    .stat { display: flex; flex-direction: column; }
    .stat-val { font-size: 1.1rem; font-weight: 800; }
    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .btn-scanner {
      display: inline-block;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-scanner:hover { background: #ffe033; text-decoration: none; }

    .section { margin-bottom: 32px; }

    /* New event modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 200;
      align-items: flex-end;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 48px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; }
    .modal-close {
      float: right;
      background: var(--bg-card2);
      border: none;
      color: var(--text-muted);
      font-size: 1.1rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="logo"><span>Wave</span>Tickets</a>
    </div>
  </nav>

  <div class="dash-header">
    <div class="container-wide dash-header-inner">
      <div>
        <div class="dash-welcome">Welcome back</div>
        <div class="dash-name">{{ARTIST_NAME}}</div>
      </div>
      <form action="/logout" method="POST">
        <button type="submit" class="logout-btn">Sign Out</button>
      </form>
    </div>
  </div>

  <div class="container-wide">

    <!-- Summary Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-label">Total Tickets Sold</div>
        <div class="stat-card-val">{{TOTAL_SOLD}}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Total Revenue</div>
        <div class="stat-card-val" style="font-size:1.4rem">{{TOTAL_REVENUE}}</div>
      </div>
    </div>

    <!-- Events -->
    <div class="section">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <p class="section-title" style="margin:0">Your Events</p>
        <button class="btn btn-outline btn-sm" onclick="document.getElementById('new-event-modal').classList.add('open')">
          + New Event
        </button>
      </div>
      {{EVENTS_HTML}}
    </div>

    <!-- Buyers -->
    <div class="section">
      <p class="section-title">Recent Buyers</p>
      <div class="card" style="padding:0">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Event</th>
                <th>Purchased</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {{BUYERS_HTML}}
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <!-- New Event Modal -->
  <div class="modal-backdrop" id="new-event-modal" onclick="closeOnBackdrop(event)">
    <div class="modal">
      <button class="modal-close" onclick="document.getElementById('new-event-modal').classList.remove('open')">✕</button>
      <div class="modal-title">Create New Event</div>

      <div id="event-form-msg" style="display:none;margin-bottom:14px;font-size:0.875rem;"></div>

      <form id="event-form" onsubmit="createEvent(event)">
        <div class="form-group">
          <label>Event Name</label>
          <input type="text" name="event_name" placeholder="Friday Night Jam" required maxlength="120">
        </div>
        <div class="form-group">
          <label>Artist Name</label>
          <input type="text" name="artist_name" placeholder="{{ARTIST_NAME}}" value="{{ARTIST_NAME}}" required maxlength="80">
        </div>
        <div class="form-group">
          <label>Date & Time</label>
          <input type="datetime-local" name="date" required>
        </div>
        <div class="form-group">
          <label>Venue</label>
          <input type="text" name="venue" placeholder="Senegambia Strip, Kololi" required maxlength="120">
        </div>
        <div class="form-group">
          <label>Ticket Price (GMD)</label>
          <input type="number" name="ticket_price_gmd" placeholder="500" required min="1">
        </div>
        <div class="form-group">
          <label>Total Tickets Available</label>
          <input type="number" name="total_tickets" placeholder="200" required min="1">
        </div>
        <div class="form-group">
          <label>Cover Image URL (optional)</label>
          <input type="url" name="cover_image_url" placeholder="https://...">
        </div>
        <button type="submit" class="btn btn-gold">Create Event</button>
      </form>
    </div>
  </div>

  <script>
    function closeOnBackdrop(e) {
      if (e.target === document.getElementById('new-event-modal'))
        document.getElementById('new-event-modal').classList.remove('open');
    }

    async function createEvent(e) {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector('button[type=submit]');
      const msg = document.getElementById('event-form-msg');
      btn.disabled = true; btn.textContent = 'Creating...';

      const data = Object.fromEntries(new FormData(form));
      try {
        const res = await fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || 'Failed');
        msg.style.display = 'block';
        msg.style.color = '#00cc66';
        msg.textContent = '✓ Event created! Refreshing...';
        setTimeout(() => window.location.reload(), 1200);
      } catch(err) {
        msg.style.display = 'block';
        msg.style.color = '#ff4444';
        msg.textContent = err.message;
        btn.disabled = false; btn.textContent = 'Create Event';
      }
    }
  </script>
</body>
</html>
